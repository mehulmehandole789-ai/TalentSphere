<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Discover independent artists, book talent for your events, and manage creative collaborations with TalentSphere.">
<meta name="theme-color" content="#173f36">
<title>TalentSphere — Discover Talent. Connect. Collaborate. Create.</title>
<style>
:root{
  --ink:#14121a;
  --ink-soft:#1e1a28;
  --ink-softer:#282239;
  --paper:#f7f3ec;
  --paper-dim:#efe7d8;
  --amber:#f2a93b;
  --amber-dim:#8b5b13;
  --coral:#b74738;
  --violet:#6b4fa0;
  --violet-deep:#3d2c5b;
  --green:#287447;
  --text-ink:#f4efe4;
  --text-ink-mute:#aea4c4;
  --text-paper:#1c1720;
  --text-paper-mute:#6c6473;
  --line-ink:rgba(244,239,228,.14);
  --line-paper:rgba(28,23,32,.13);
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:8px;
  --shadow-lift:0 20px 50px -20px rgba(20,18,26,.5);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--text-paper);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em;}
p{margin:0;}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
@media(max-width:720px){.wrap{padding:0 18px;}}

/* ---------- utility ---------- */
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:500;}
.eyebrow.on-ink{color:var(--amber);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:13px 26px;font-weight:600;font-size:14.5px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-amber{background:var(--amber);color:var(--ink);}
.btn-amber:hover{background:#ffbf5c;box-shadow:0 10px 24px -8px rgba(242,169,59,.6);}
.btn-outline-ink{background:transparent;color:var(--text-ink);border:1.5px solid var(--line-ink);}
.btn-outline-ink:hover{border-color:var(--amber);color:var(--amber);}
.btn-outline-paper{background:transparent;color:var(--text-paper);border:1.5px solid var(--line-paper);}
.btn-outline-paper:hover{border-color:var(--coral);color:var(--coral);}
.btn-coral{background:var(--coral);color:#fff;}
.btn-coral:hover{background:#f16f5e;box-shadow:0 10px 24px -8px rgba(232,92,74,.55);}
.btn-dark{background:var(--ink);color:var(--text-ink);}
.btn-dark:hover{background:var(--ink-soft);}
.btn-sm{padding:9px 18px;font-size:13px;}
.btn-block{width:100%;}
.btn-ghost-danger{background:transparent;color:#c24a3e;border:1.5px solid rgba(194,74,62,.35);}
.btn-ghost-danger:hover{background:rgba(194,74,62,.08);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:999px;font-weight:500;}
.pill-amber{background:rgba(242,169,59,.16);color:var(--amber-dim);}
.pill-green{background:rgba(95,174,125,.15);color:#3d7d58;}
.pill-coral{background:rgba(232,92,74,.13);color:var(--coral);}
.pill-violet{background:rgba(107,79,160,.13);color:var(--violet);}
.pill-muted{background:rgba(28,23,32,.06);color:var(--text-paper-mute);}

.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;color:#fff;flex-shrink:0;}

/* ---------- ticket / stub motif ---------- */
.stub{position:relative;background:var(--paper);border-radius:var(--radius-lg);border:1.5px solid var(--line-paper);overflow:hidden;}
.stub::after{content:"";position:absolute;left:0;right:0;top:var(--perf,132px);height:0;border-top:2px dashed rgba(28,23,32,.16);}
.stub .stub-notch{position:absolute;top:calc(var(--perf,132px) - 9px);width:18px;height:18px;border-radius:50%;background:var(--stub-bg,var(--paper));}
.stub .stub-notch.left{left:-9px;}
.stub .stub-notch.right{right:-9px;}

/* ---------- top nav ---------- */
#topnav{position:sticky;top:0;z-index:60;background:rgba(20,18,26,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-ink);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px;color:var(--text-ink);}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-ink);}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 5px rgba(242,169,59,.18);}
.navlinks{display:flex;align-items:center;gap:30px;}
.navlinks a,.navlinks button.navlink{background:none;border:none;color:var(--text-ink-mute);font-size:14px;font-weight:500;padding:6px 0;position:relative;}
.navlinks a:hover,.navlinks button.navlink:hover,.navlinks a.active,.navlinks button.navlink.active{color:var(--text-ink);}
.navlinks a.active::after,.navlinks button.navlink.active::after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:2px;background:var(--amber);}
.navcta{display:flex;align-items:center;gap:12px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--ink-soft);border:1px solid var(--line-ink);display:flex;align-items:center;justify-content:center;color:var(--text-ink-mute);position:relative;font-size:16px;}
.icon-btn:hover{color:var(--amber);border-color:var(--amber);}
.badge-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--ink);}
.menu-toggle{display:none;background:none;border:none;color:var(--text-ink);font-size:22px;}
@media(max-width:920px){
  .navlinks{position:fixed;top:72px;left:0;right:0;background:var(--ink);flex-direction:column;align-items:flex-start;padding:18px 24px 24px;gap:16px;border-bottom:1px solid var(--line-ink);transform:translateY(-8px);opacity:0;pointer-events:none;transition:.18s ease;}
  .navlinks.open{transform:translateY(0);opacity:1;pointer-events:auto;}
  .navlinks a.active::after,.navlinks button.navlink.active::after{display:none;}
  .menu-toggle{display:block;}
}

/* ---------- hero ---------- */
.hero{position:relative;background:radial-gradient(120% 140% at 15% 0%, #26203a 0%, var(--ink) 55%);color:var(--text-ink);padding:96px 0 120px;overflow:hidden;}
.hero-glow{position:absolute;top:-160px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,59,.35),transparent 70%);filter:blur(10px);}
.hero-glow.two{top:220px;left:-160px;width:420px;height:420px;background:radial-gradient(circle,rgba(232,92,74,.28),transparent 70%);}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr;}}
.marquee-row{display:flex;gap:8px;align-items:center;margin-bottom:22px;}
.marquee-bulb{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
.hero h1{font-size:clamp(38px,5.4vw,64px);line-height:1.03;font-weight:700;margin:0 0 22px;}
.hero h1 em{font-style:normal;color:var(--amber);}
.hero p.lead{font-size:18px;line-height:1.6;color:var(--text-ink-mute);max-width:520px;margin-bottom:34px;}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:40px;}
.hero-stats{display:flex;gap:36px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:var(--font-display);font-size:26px;color:var(--text-ink);}
.hero-stat span{font-size:12.5px;color:var(--text-ink-mute);font-family:var(--font-mono);letter-spacing:.04em;}

.hero-card-stack{position:relative;height:460px;}
.floatcard{position:absolute;width:230px;background:var(--paper);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-lift);}
.floatcard .fc-top{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.floatcard .fc-name{font-weight:700;font-size:14.5px;}
.floatcard .fc-cat{font-size:12px;color:var(--text-paper-mute);}
.floatcard .fc-strip{height:64px;border-radius:10px;margin-bottom:10px;}
.fc1{top:0;left:6%;transform:rotate(-6deg);}
.fc2{top:120px;right:0;transform:rotate(5deg);z-index:2;}
.fc3{bottom:0;left:16%;transform:rotate(-3deg);}
@media(max-width:980px){.hero-card-stack{height:340px;margin-top:20px;}.floatcard{width:180px;}}
@media(max-width:560px){.hero-card-stack{display:none;}}

/* ---------- sections ---------- */
section{padding:88px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:42px;flex-wrap:wrap;}
.section-head h2{font-size:clamp(26px,3.4vw,38px);}
.section-sub{color:var(--text-paper-mute);font-size:15px;max-width:460px;margin-top:10px;}
.section-dark{background:var(--ink);color:var(--text-ink);}
.section-dark .section-sub{color:var(--text-ink-mute);}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media(max-width:900px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:600px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
.cat-card{background:#fff;border:1.5px solid var(--line-paper);border-radius:var(--radius-md);padding:22px 18px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:10px;}
.cat-card:hover{border-color:var(--coral);transform:translateY(-3px);box-shadow:var(--shadow-lift);}
.ico{display:inline-block;vertical-align:-0.16em;flex-shrink:0;}
.cat-card .ic{font-size:26px;}
.cat-card b{font-size:15px;}
.cat-card span{font-size:12.5px;color:var(--text-paper-mute);}

.card-row{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
@media(max-width:1080px){.card-row{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.card-row{grid-template-columns:1fr;}}
.card-row.cols3{grid-template-columns:repeat(3,1fr);}
@media(max-width:1080px){.card-row.cols3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.card-row.cols3{grid-template-columns:1fr;}}

/* artist card */
.artist-card{background:#fff;border:1.5px solid var(--line-paper);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:.18s;}
.artist-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:transparent;}
.ac-cover{height:120px;position:relative;}
.ac-avatar{width:66px;height:66px;font-size:22px;border:4px solid #fff;position:absolute;bottom:-33px;left:18px;box-shadow:0 4px 10px rgba(0,0,0,.15);}
.ac-body{padding:42px 18px 18px;}
.ac-name-row{display:flex;align-items:center;gap:6px;}
.ac-name{font-weight:700;font-size:16.5px;font-family:var(--font-display);}
.verified{color:#3d8cf2;font-size:13px;}
.ac-meta{font-size:12.5px;color:var(--text-paper-mute);margin-top:2px;}
.ac-desc{font-size:13.5px;color:var(--text-paper-mute);margin:12px 0;line-height:1.5;min-height:38px;}
.ac-row2{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.rating{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;}
.rating .stars{color:var(--amber-dim);}
.price-tag{font-family:var(--font-mono);font-size:13px;font-weight:500;}
.price-tag b{font-family:var(--font-body);font-size:15px;}
.ac-actions{display:flex;gap:8px;}
.ac-actions .btn{flex:1;padding:10px 12px;font-size:13px;}

/* event card (ticket stub) */
.event-card{--perf:132px;--stub-bg:#fff;background:#fff;border:1.5px solid var(--line-paper);}
.ec-banner{height:132px;position:relative;display:flex;align-items:flex-end;padding:14px;}
.ec-banner .ec-cat{background:rgba(20,18,26,.55);color:#fff;backdrop-filter:blur(4px);}
.ec-date-chip{position:absolute;top:14px;right:14px;background:#fff;border-radius:10px;padding:6px 10px;text-align:center;line-height:1.1;box-shadow:0 4px 10px rgba(0,0,0,.15);}
.ec-date-chip b{display:block;font-family:var(--font-display);font-size:17px;}
.ec-date-chip span{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;color:var(--text-paper-mute);}
.ec-body{padding:22px 18px 18px;}
.ec-title{font-family:var(--font-display);font-weight:700;font-size:17.5px;margin-bottom:6px;}
.ec-org{font-size:12.5px;color:var(--text-paper-mute);margin-bottom:12px;}
.ec-meta-list{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-paper);margin-bottom:16px;}
.ec-meta-list span.ic{opacity:.55;margin-right:6px;}
.ec-foot{display:flex;justify-content:space-between;align-items:center;}
.ec-foot .btn{width:100%;}

/* how it works */
.steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media(max-width:900px){.steps-row{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.steps-row{grid-template-columns:1fr;}}
.step{background:var(--ink-soft);border:1px solid var(--line-ink);border-radius:var(--radius-md);padding:26px 22px;}
.step .num{font-family:var(--font-mono);color:var(--amber);font-size:12.5px;letter-spacing:.08em;margin-bottom:14px;display:block;}
.step h4{font-size:17px;margin-bottom:8px;}
.step p{font-size:13.5px;color:var(--text-ink-mute);line-height:1.55;}

.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:820px){.why-grid{grid-template-columns:1fr;}}
.why-card{border:1.5px solid var(--line-paper);border-radius:var(--radius-md);padding:26px;background:var(--paper-dim);}
.why-card .ic{font-size:24px;margin-bottom:12px;}
.why-card h4{font-size:16.5px;margin-bottom:8px;}
.why-card p{font-size:13.5px;color:var(--text-paper-mute);line-height:1.55;}

.testi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:900px){.testi-row{grid-template-columns:1fr;}}
.testi{background:#fff;border:1.5px solid var(--line-paper);border-radius:var(--radius-lg);padding:26px;}
.testi .stars{color:var(--amber-dim);font-size:14px;margin-bottom:14px;}
.testi p{font-size:14.5px;line-height:1.6;margin-bottom:18px;}
.testi .who{display:flex;align-items:center;gap:10px;}
.testi .who b{font-size:13.5px;display:block;}
.testi .who span{font-size:12px;color:var(--text-paper-mute);}

.cta-band{background:linear-gradient(120deg,var(--violet-deep),var(--ink) 70%);color:#fff;border-radius:28px;padding:64px 48px;text-align:center;position:relative;overflow:hidden;}
.cta-band h2{font-size:clamp(26px,3.6vw,40px);margin-bottom:14px;}
.cta-band p{color:var(--text-ink-mute);max-width:480px;margin:0 auto 30px;}
.cta-band .hero-glow{opacity:.7;}

footer{background:var(--ink);color:var(--text-ink-mute);padding:64px 0 30px;}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:40px;margin-bottom:48px;}
@media(max-width:800px){.foot-grid{grid-template-columns:repeat(2,1fr);}}
.foot-grid h5{color:var(--text-ink);font-size:13px;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px;}
.foot-grid a{display:block;font-size:13.5px;margin-bottom:10px;color:var(--text-ink-mute);}
.foot-grid a:hover{color:var(--amber);}
.foot-bottom{border-top:1px solid var(--line-ink);padding-top:24px;display:flex;justify-content:space-between;font-size:12.5px;flex-wrap:wrap;gap:10px;}

/* ---------- generic page shell (app pages) ---------- */
.page{min-height:70vh;}
.page-hero{background:var(--ink);color:var(--text-ink);padding:52px 0 40px;}
.page-hero h1{font-size:clamp(26px,3.6vw,36px);}
.page-hero p{color:var(--text-ink-mute);margin-top:8px;max-width:560px;}
.breadcrumb{font-family:var(--font-mono);font-size:11.5px;color:var(--text-ink-mute);letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px;}
.breadcrumb a{color:var(--amber);}

.layout-2col{display:grid;grid-template-columns:280px 1fr;gap:32px;padding:44px 0 90px;}
@media(max-width:900px){.layout-2col{grid-template-columns:1fr;}}
.filters-card{background:#fff;border:1.5px solid var(--line-paper);border-radius:var(--radius-lg);padding:22px;height:fit-content;position:sticky;top:90px;}
.filters-card h4{font-size:14px;margin-bottom:16px;font-family:var(--font-body);font-weight:700;}
.f-group{margin-bottom:20px;}
.f-group label{display:block;font-size:12px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--text-paper-mute);margin-bottom:8px;}
.f-group select,.f-group input[type=text],.f-group input[type=number],.f-group input[type=date],.f-group input[type=email],.f-group input[type=password],.f-group textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line-paper);font-family:var(--font-body);font-size:14px;background:#fff;color:var(--text-paper);
}
.f-group select:focus,.f-group input:focus,.f-group textarea:focus{outline:none;border-color:var(--coral);}
.f-group textarea{resize:vertical;min-height:90px;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip-opt{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line-paper);font-size:12.5px;background:#fff;color:var(--text-paper);}
.chip-opt.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.range-row{display:flex;align-items:center;gap:8px;}
.results-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.results-count{font-size:14px;color:var(--text-paper-mute);}
.searchbar{position:relative;margin-bottom:26px;}
.searchbar input{width:100%;padding:16px 20px 16px 46px;border-radius:14px;border:1.5px solid var(--line-paper);font-size:15px;background:#fff;}
.searchbar input:focus{outline:none;border-color:var(--coral);}
.searchbar .sic{position:absolute;left:18px;top:50%;transform:translateY(-50%);opacity:.5;}

/* ---------- auth ---------- */
.auth-shell{min-height:80vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 20% 0%,#26203a,var(--ink) 55%);padding:60px 20px;}
.auth-card{background:var(--paper);border-radius:26px;width:100%;max-width:440px;padding:40px 36px;box-shadow:var(--shadow-lift);}
.auth-card h2{font-size:26px;margin-bottom:6px;}
.auth-card .sub{color:var(--text-paper-mute);font-size:13.5px;margin-bottom:26px;}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
.role-opt{border:1.5px solid var(--line-paper);border-radius:16px;padding:20px 14px;text-align:left;background:#fff;transition:.15s;}
.role-opt:hover{border-color:var(--coral);}
.role-opt.active{border-color:var(--coral);background:rgba(232,92,74,.06);}
.role-opt .ic{font-size:22px;margin-bottom:10px;}
.role-opt b{display:block;font-size:14px;margin-bottom:3px;}
.role-opt span{font-size:12px;color:var(--text-paper-mute);}
.form-foot{margin-top:20px;text-align:center;font-size:13.5px;color:var(--text-paper-mute);}
.form-foot a{color:var(--coral);font-weight:600;}
.field-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.field-row2{grid-template-columns:1fr;}}

/* ---------- dashboards ---------- */
.dash-shell{background:var(--paper-dim);min-height:80vh;}
.dash-top{padding:36px 0 0;}
.dash-greet{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:28px;}
.dash-greet h1{font-size:26px;}
.dash-greet p{color:var(--text-paper-mute);margin-top:4px;font-size:14px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px;}
@media(max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:#fff;border:1.5px solid var(--line-paper);border-radius:var(--radius-md);padding:20px;}
.stat-card .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-paper-mute);}
.stat-card .val{font-family:var(--font-display);font-size:28px;margin-top:8px;}
.stat-card .delta{font-size:12px;color:#3d7d58;margin-top:4px;}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:22px;padding-bottom:80px;}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}

.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line-paper);margin-bottom:24px;overflow-x:auto;}

function icon(name, size=16, stroke=1.8){
  const path = ICON_PATHS[name] || ICON_PATHS.circle || '';
  return `<svg aria-hidden="true" focusable="false" class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
function initials(name){return name.replace(/^\[Demo\]\s*/, "").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();}

// All data below is loaded from the TalentSphere REST API (see /backend).
// Nothing here is hardcoded — these are simply the in-memory caches the UI renders from.
let ARTISTS = [];
let EVENTS = [];
let APPLICATIONS = [];
let BOOKINGS = [];
let COLLABORATIONS = [];
let REVIEWS = [];
let NOTIFICATIONS = [];
let ADMIN_USERS = [];
let ADMIN_REPORTS = {};
let PAYMENT_DETAIL = null, PAYMENT_HISTORY = [], PAYMENT_RECEIPT = null;
let ADMIN_PAYMENTS = {orders:[],total:0,page:1};
let paymentAdminFilters = {status:'',mode:'',q:'',page:1};
let checkoutInProgress = false, paymentRefreshInProgress = false, checkoutScriptPromise;
function fmtPaise(amount){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format((amount||0)/100);}
function paymentBadge(status){const names={unpaid:'Not paid',pending:'Pending',authorized:'Awaiting capture',paid:'Paid',captured:'Captured',failed:'Failed',abandoned:'Checkout closed',expired:'Session expired',cancelled:'Cancelled',review_required:'Admin review',partially_refunded:'Partially refunded',refunded:'Refunded',creating:'Preparing order',created:'Order created',creation_unknown:'Creation unresolved'};return `<span class="status-badge payment-${status}">${names[status]||status}</span>`;}
async function loadPaymentPage(){
 if(state.view==='payment'&&state.role==='organizer')PAYMENT_DETAIL=await api(`/payments/bookings/${state.params.id}`);
 if(state.view==='payment-history'&&state.role==='organizer')PAYMENT_HISTORY=await api('/payments/history');
 if(state.view==='receipt'&&state.role==='organizer')PAYMENT_RECEIPT=await api(`/payments/receipts/${state.params.id}`);
 if(state.view==='admin-payments'&&state.role==='admin'){
  const query=new URLSearchParams(Object.entries(paymentAdminFilters).filter(([,value])=>value!==''));
  ADMIN_PAYMENTS=await api('/payments/admin/orders?'+query);
 }
}
async function refreshPaymentStatus(){
 if(paymentRefreshInProgress||checkoutInProgress||state.view!=='payment'||state.role!=='organizer'||document.hidden)return;
 paymentRefreshInProgress=true;const bookingId=state.params.id;
 try{const data=await api(`/payments/bookings/${bookingId}`);if(state.view==='payment'&&state.params.id===bookingId){PAYMENT_DETAIL=data;render();}}catch(err){toast(err.message,true);}finally{paymentRefreshInProgress=false;}
}
function loadCheckoutScript(){
 if(window.Razorpay)return Promise.resolve();
 if(checkoutScriptPromise)return checkoutScriptPromise;
 checkoutScriptPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://checkout.razorpay.com/v1/checkout.js';script.async=true;script.onload=()=>window.Razorpay?resolve():reject(new Error('Checkout could not be initialized.'));script.onerror=()=>{script.remove();checkoutScriptPromise=null;reject(new Error('Razorpay Checkout could not load. Check your connection and try again.'));};document.head.appendChild(script);});
 return checkoutScriptPromise;
}
async function startCheckout(bookingId){
 if(checkoutInProgress)return;checkoutInProgress=true;render();
 let timer,settled=false,checkout;
 async function finish(action,response){
  if(settled)return;settled=true;clearTimeout(timer);
  try{
   if(action==='verify'){
    PAYMENT_DETAIL=await api(`/payments/bookings/${bookingId}/verify`,{method:'POST',body:JSON.stringify(response)});
    toast(PAYMENT_DETAIL.booking.paymentStatus==='paid'?'Captured payment verified. Your booking is confirmed.':'Payment is still awaiting capture or review. Check the saved status below.');
   }else{
    if(['dismissed','timeout'].includes(action))await api(`/payments/bookings/${bookingId}/session`,{method:'POST',body:JSON.stringify({action})});
    PAYMENT_DETAIL=await api(`/payments/bookings/${bookingId}`);
    toast(action==='failed'?'Payment did not complete. Provider status has been checked.':'Checkout closed. Any delayed payment will be reconciled before another attempt.');
   }
  }catch(err){toast(err.message,true);}finally{checkoutInProgress=false;checkout?.close();await nav('payment',{id:bookingId});}
 }
 try{
  const order=await api(`/payments/bookings/${bookingId}/order`,{method:'POST',body:'{}'});
  await loadCheckoutScript();
  checkout=new window.Razorpay({key:order.keyId,order_id:order.orderId,amount:order.amountPaise,currency:order.currency,name:'TalentSphere',description:'Artist booking '+bookingId,
   theme:{color:'#24584c'},timeout:900,retry:{enabled:false},
   handler:response=>finish('verify',response),modal:{ondismiss:()=>finish('dismissed')}});

function unescapeText(value){const element=document.createElement("textarea");element.innerHTML=value;return element.value;}
function escapeRecord(value){
 if(typeof value==="string")return value.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
 if(Array.isArray(value))return value.map(escapeRecord);
 if(value&&typeof value==="object")return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,escapeRecord(v)]));return value;
}
// Keep imported display labels separate from stored account and event records.
function presentRecord(value){
 if(Array.isArray(value))return value.map(presentRecord);
 if(!value||typeof value!=='object')return value;
 const result=Object.fromEntries(Object.entries(value).map(([key,item])=>[key,presentRecord(item)]));
 const imported=typeof value.name==='string'&&/^\[Demo\]\s*/i.test(value.name);
 for(const key of ['name','artistName','organizerName','eventName','author']){
  if(typeof result[key]==='string')result[key]=result[key].replace(/^\[Demo\]\s*/i,'');
 }
 if(imported){result.isExample=true;result.verified=false;result.rating=0;result.reviews=0;}
 return result;
}

const API_BASE = window.TALENTSPHERE_API_BASE || "/api";
function authToken(){ return localStorage.getItem("ts_token"); }
function setAuthToken(t){ if(t) localStorage.setItem("ts_token", t); else localStorage.removeItem("ts_token"); }

async function api(path, options={}){
  const headers = Object.assign({"Content-Type":"application/json"}, options.headers||{});
  const token = authToken();
  if(token) headers["Authorization"] = "Bearer "+token;
  let res;
  try{
    res = await fetch(API_BASE+path, Object.assign({}, options, {headers}));
  }catch(networkErr){
    throw new Error("We could not connect. Check your connection and try again.");
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* empty body */ }
  if(res.status===401){setAuthToken(null);state.role=null;state.user=null;}
  if(!res.ok){
    const error=new Error((data && data.error) || "Something went wrong.");
    error.code=data?.code;error.status=res.status;error.data=data||{};throw error;
  }
  return escapeRecord(presentRecord(data));
}

// Backend Event rows use organizerName/gradSeed/icon; the UI templates were written
// against organizer/grad/ic. Map once here rather than touching every render function.
function mapEvent(e){
  return Object.assign({}, e, {organizer:e.organizerName, grad:e.gradSeed, ic:e.icon});
}

function timeAgo(iso){
  const then = new Date(iso.replace(" ","T")+"Z").getTime();
  const diffMs = Date.now()-then;
  const mins = Math.round(diffMs/60000);
  if(mins<1) return "just now";
  if(mins<60) return mins+"m ago";
  const hrs = Math.round(mins/60);
  if(hrs<24) return hrs+"h ago";
  const days = Math.round(hrs/24);
  if(days<30) return days+"d ago";
  const months = Math.round(days/30);
  return months+"mo ago";
}
function mapNotification(n){ return Object.assign({}, n, {when:timeAgo(n.createdAt)}); }

function readVerificationState(){try{return JSON.parse(sessionStorage.getItem('ts_email_verification'))||{email:'',resendAvailableAt:0};}catch{return {email:'',resendAvailableAt:0};}}
function rememberVerification(email,details={}){
 const normalized=email.trim().toLowerCase();
 const previous=state.verification.email===normalized?state.verification:{email:normalized,resendAvailableAt:0};
 const retry=details.retryAfterSeconds?Date.now()+details.retryAfterSeconds*1000:0;
 state.verification={...previous,email:normalized,resendAvailableAt:Math.max(details.resendAvailableAt||previous.resendAvailableAt||0,retry)};
 sessionStorage.setItem('ts_email_verification',JSON.stringify(state.verification));
}

function syncAuthControls(){
 document.querySelectorAll('[data-auth-submit]').forEach(button=>{button.disabled=state.authBusy;button.setAttribute('aria-busy',String(state.authBusy));});
 const resend=document.querySelector('[data-action="resend-code"]');

function toast(msg, err){
  const wrap = document.getElementById("toastwrap");
  const el = document.createElement("div");
  el.className = "toast"+(err?" err":"");
  el.innerHTML = `<span>${err?icon('alert',15):icon('checkcircle',15)}</span><span>${escapeRecord(msg)}</span>`;
  while(wrap.children.length>=3)wrap.firstElementChild.remove();
  wrap.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition=".25s";setTimeout(()=>el.remove(),250);},3200);
}

async function nav(view, params={}){
  state.view = view;
  history.replaceState(null,"", "#"+view+(params.id?"/"+encodeURIComponent(params.id):""));
  state.params = params;
  state.navOpen = false;
  state.pageError=null;state.loading=true;render();
  window.scrollTo({top:0,behavior:"instant"});
  try{
    await refreshPublicData();
    await refreshRoleData();
    await loadPaymentPage();
    if(view==="artist-profile" && params.id){
      const detail = await api(`/artists/${params.id}`);
      REVIEWS = detail.reviews;
      const idx = ARTISTS.findIndex(a=>a.id===params.id);
      if(idx>=0) ARTISTS[idx] = detail.artist; else ARTISTS.push(detail.artist);
    }
    if(view==="admin-users"){
      ADMIN_USERS = await api("/admin/users");
    }
    if(view==="admin-dashboard"){
      ADMIN_REPORTS = await api("/admin/reports");
    }
  }catch(err){
    state.pageError=err.message;toast(err.message, true);
  }
  state.loading=false;
  render();
}

// Pulls the data each role's views depend on. Cheap enough to call on every
// navigation for a project this size — keeps every screen in sync with the DB.
async function refreshRoleData(){
  if(state.role==="artist" || state.role==="organizer"){
    const [bookings, applications, notifications] = await Promise.all([
      api("/bookings"), api("/applications"), api("/notifications")
    ]);
    BOOKINGS = bookings;
    APPLICATIONS = applications;
    NOTIFICATIONS = notifications.map(mapNotification);
    COLLABORATIONS = state.role==="artist" ? await api("/collaborations") : [];
  }else if(state.role==="admin"){
    const [events, bookings] = await Promise.all([api("/admin/events"), api("/admin/bookings")]);
    EVENTS = events.map(mapEvent);
    BOOKINGS = bookings;
  }else{
    BOOKINGS = []; APPLICATIONS = []; NOTIFICATIONS = []; COLLABORATIONS = [];
  }
}

async function refreshPublicData(){
  const [artists, events] = await Promise.all([api("/artists"), api("/events")]);
  ARTISTS = artists;
  EVENTS = events.map(mapEvent);
}

// Restores a session from a saved token, loads baseline data, then renders.
async function boot(){
  try{
    await refreshPublicData();
  }catch(err){
    document.getElementById("app").innerHTML = `<div style="padding:80px 24px;text-align:center;font-family:sans-serif;color:#c24a3e;">Couldn't reach the TalentSphere API. Make sure the backend is running (see README), then refresh.<br><br><small>${err.message}</small></div>`;
    return;
  }
  const token = authToken();
  if(token){
    try{
      const me = await api("/auth/me");
      state.role = me.user.role;
      state.user = { id:me.user.id, name: me.user.name, artistId: me.artistProfile ? me.artistProfile.id : null };
      await refreshRoleData();
    }catch(err){
      setAuthToken(null);
      state.role = null; state.user = null;
      if(err.code==='EMAIL_UNVERIFIED'){rememberVerification(err.data.email,err.data);state.authRedirect='verify-email';state.authNotice=err.message;}
      else if(['APPROVAL_PENDING','APPROVAL_REJECTED','ACCOUNT_SUSPENDED'].includes(err.code)){state.authRedirect='account-status';state.approvalMessage=err.message;}
    }
  }
  const [route,routeId]=location.hash.slice(1).split("/");
  if(route && route!=="booking-review"){
    state.view=route;state.params=routeId?{id:decodeURIComponent(routeId)}:{};
    if(route==="artist-profile"&&routeId){try{const detail=await api(`/artists/${encodeURIComponent(routeId)}`);REVIEWS=detail.reviews;}catch(err){toast(err.message,true);}}
    if(state.role==="admin"){ADMIN_REPORTS=await api("/admin/reports");ADMIN_USERS=await api("/admin/users");}
  }
  if(state.authRedirect){state.view=state.authRedirect;state.params={};history.replaceState(null,"","#"+state.authRedirect);state.authRedirect=null;}
  try{await loadPaymentPage();}catch(err){state.pageError=err.message;}
  state.loading = false;
  render();
}

/* ---------------- EXPLORE TALENT ---------------- */
function renderExplore(){
  const f = state.explore;
  if(f.maxPrice===null)f.maxPrice=Math.max(40000,...ARTISTS.map(a=>a.price));
  let list = ARTISTS.filter(a=>{
    if(f.category!=="All" && a.category!==f.category) return false;
    if(f.location!=="All" && a.location!==f.location) return false;
    if(f.availability&&f.availability!=="All"&&a.availability!==f.availability)return false;
    if(a.price>f.maxPrice) return false;
    if(f.q && !(a.name.toLowerCase().includes(f.q.toLowerCase())||a.skills.join(" ").toLowerCase().includes(f.q.toLowerCase())||a.category.toLowerCase().includes(f.q.toLowerCase()))) return false;
    return true;
  });
  if(f.sort==="Highest Rated") list = [...list].sort((a,b)=>b.rating-a.rating);
  else if(f.sort==="Most Experienced") list = [...list].sort((a,b)=>b.exp-a.exp);
  else if(f.sort==="Price: Low to High") list = [...list].sort((a,b)=>a.price-b.price);
  else if(f.sort==="Newest") list = [...list].sort((a,b)=>b.joined.localeCompare(a.joined));

  const page=Math.min(f.page||1,Math.max(1,Math.ceil(list.length/12)));
  const locations = ["All",...new Set(ARTISTS.map(a=>a.location))];

  return `
  <div class="page-hero"><div class="wrap"><span class="eyebrow on-ink">Explore Talent</span><h1 style="margin-top:10px;">Discover your next creative collaborator.</h1><p>Find creative professionals by skill, location, budget and availability.</p></div></div>
  <div class="wrap layout-2col">
    <button class="btn btn-outline-paper mobile-filter-toggle" data-action="toggle-filters" aria-expanded="${state.filtersOpen}" aria-controls="artist-filters">${icon('sliders',16)} ${state.filtersOpen?'Hide filters':'Search filters'}</button>
    <aside id="artist-filters" class="filters-card ${state.filtersOpen?'open':''}">
      <h4>Filters</h4>
      <div class="f-group"><label>Category</label>
        <select data-bind="explore-category">
          <option ${f.category==='All'?'selected':''}>All</option>
          ${CATEGORIES.map(c=>`<option ${f.category===c.name?'selected':''}>${c.name}</option>`).join("")}
        </select>
      </div>
      <div class="f-group"><label>Location</label>
        <select data-bind="explore-location">${locations.map(l=>`<option ${f.location===l?'selected':''}>${l}</option>`).join("")}</select>
      </div>
      <div class="f-group"><label>Max price: ${fmtMoney(f.maxPrice)}</label>
        <input type="range" min="0" max="${Math.max(40000,...ARTISTS.map(a=>a.price),f.maxPrice)}" step="1000" value="${f.maxPrice}" data-bind="explore-price" style="width:100%;">
      </div>
      <div class="f-group"><label>Availability</label><select data-bind="explore-availability">${['All',...new Set(ARTISTS.map(a=>a.availability))].map(v=>`<option ${f.availability===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <button class="btn btn-outline-paper btn-block" data-action="reset-filters">Reset filters</button>
    </aside>
    <div>
      <div class="searchbar"><span class="sic">${icon('search',16)}</span><input type="text" placeholder="Search artists, skills, genres…" value="${f.q}" aria-label="Search artists" data-bind="explore-q"></div>
      <div class="results-topbar">
        <span class="results-count">${list.length} artist${list.length!==1?'s':''} found</span>
        <select aria-label="Sort artists" data-bind="explore-sort" style="padding:9px 12px;border-radius:10px;border:1.5px solid var(--line-paper);font-size:13.5px;">
          ${["Recommended","Highest Rated","Most Experienced","Price: Low to High","Newest"].map(s=>`<option ${f.sort===s?'selected':''}>${s}</option>`).join("")}
        </select>
      </div>
      <div class="active-filters" aria-label="Active filters">${[['q',f.q],['category',f.category!=='All'?f.category:''],['location',f.location!=='All'?f.location:''],['availability',f.availability!=='All'?f.availability:''],['maxPrice',f.maxPrice<Math.max(40000,...ARTISTS.map(a=>a.price))?'Up to '+fmtMoney(f.maxPrice):'']].filter(([,value])=>value).map(([key,value])=>`<button class="filter-token" data-action="clear-filter" data-filter="${key}" aria-label="Remove filter ${escapeRecord(value)}">${escapeRecord(value)} &times;</button>`).join('')}</div>
      ${list.length>12?`<div class="pagination"><button class="btn btn-sm" data-action="explore-page" data-page="${page-1}" ${page===1?'disabled':''}>Previous</button><span>Page ${page} of ${Math.ceil(list.length/12)}</span><button class="btn btn-sm" data-action="explore-page" data-page="${page+1}" ${page*12>=list.length?'disabled':''}>Next</button></div>`:''}
      ${list.length? `<div class="card-row">${list.slice((page-1)*12,page*12).map((a,i)=>artistCard(a,i)).join("")}</div>` :
        `<div class="empty-state"><div class="ic">${icon('search',36,1.4)}</div><h4>No artists match your filters</h4><p>Try widening your price range or clearing a filter.</p><button class="btn btn-coral" data-action="reset-filters">Reset filters</button></div>`}
    </div>
  </div>`;
}

function renderArtistProfile(){

 const reviews=a.isExample?[]:REVIEWS.filter(r=>r.artistId===a.id),similar=ARTISTS.filter(x=>x.category===a.category&&x.id!==a.id).slice(0,2);
 return `<div class="profile-hero"><div class="profile-cover"></div><div class="wrap"><div class="profile-head"><div class="avatar profile-avatar">${profilePicture(a)}</div><div><span class="eyebrow">${a.category}</span><h1 class="profile-name">${a.name}</h1><div class="profile-meta-row"><span>${icon('pin',14)} ${a.location}</span>${a.verified&&!a.isExample?`<span class="verified">${icon('checkcircle',14)} Admin-verified profile</span>`:''}</div></div><div class="profile-actions"><button class="btn btn-outline-paper" data-action="collab-request" data-id="${a.id}">Collaborate</button><button class="btn btn-coral" data-action="book" data-id="${a.id}">Request a booking</button></div></div></div></div>
 <div class="wrap pg-2col"><div class="profile-content"><section class="panel portfolio-panel"><h3>Selected work</h3><div class="portfolio-grid">${(a.media||[]).map((url,i)=>`<button class="media-preview" data-action="preview-media" data-id="${a.id}" data-index="${i}" aria-label="Preview portfolio image ${i+1}"><img class="portfolio-image" src="${url}" alt="${a.name} portfolio work ${i+1}" loading="lazy" decoding="async" width="640" height="480"></button>`).join('')||`<div class="portfolio-empty">${icon('image',28)}<p>This artist has not added portfolio images yet.</p></div>`}</div></section><section class="panel"><h3>About the artist</h3><p style="color:var(--text-paper-mute);font-size:14px;line-height:1.9">${a.bio||'Contact this artist to learn more about their work and services.'}</p><div style="margin-top:20px">${a.skills.map(skill=>`<span class="skill-tag">${skill}</span>`).join('')}</div></section>${reviews.length?`<section class="panel"><h3>Reviews</h3>${reviews.map(r=>`<div class="review-item"><b>${r.author}</b><span style="float:right;color:var(--violet)" aria-label="${r.rating} out of 5 stars">${stars(r.rating)}</span><p style="font-size:14px;margin-top:10px;color:var(--text-paper-mute)">${r.text}</p></div>`).join('')}</section>`:''}</div><aside><div class="sidepanel-card"><span class="eyebrow">Work together</span><h4 style="margin-top:14px">Services &amp; pricing</h4><div class="price-box"><div class="amt">${fmtMoney(a.price)}</div><div class="per">Starting price per event</div></div>${a.availability?`<div class="summary-line"><span>Availability</span><b>${a.availability}</b></div>`:''}<div class="summary-line"><span>Experience</span><b>${a.exp} years</b></div><button class="btn btn-coral btn-block" style="margin-top:24px" data-action="book" data-id="${a.id}">Request a booking</button><p style="font-size:12px;color:var(--text-paper-mute);margin-top:14px">Share your details first. The artist will review your request. Payment through Razorpay becomes available after the artist accepts your request.</p></div>${similar.length?`<div class="sidepanel-card"><h4>In the same creative world</h4>${similar.map(other=>`<div class="list-row"><div class="lr-main"><div class="lr-title">${other.name}</div><div class="lr-sub">${other.location}</div></div><button class="btn btn-sm btn-outline-paper" data-action="nav" data-view="artist-profile" data-id="${other.id}">View</button></div>`).join('')}</div>`:''}</aside></div>`;
}

function renderPayment(){
 const detail=PAYMENT_DETAIL;if(!detail)return `<div class="empty-state"><h2>Payment details are loading</h2></div>`;
 const {booking:b,order,transactions,displayStatus}=detail;
 return `<div class="booking-shell payment-shell"><div class="breadcrumb"><button class="btn btn-sm btn-outline-paper" data-action="nav" data-view="organizer-bookings">Back to bookings</button></div><span class="eyebrow">${detail.mode==='test'?'Test Mode / No real money':'Secure payment / Razorpay'}</span><h1>Booking payment</h1><p class="section-sub">Your booking is confirmed only after Razorpay capture is verified by the server.</p><div class="panel" style="margin-top:24px"><div class="payment-heading"><h3>${b.eventName}</h3>${paymentBadge(displayStatus)}</div><div class="summary-line"><span>Booking reference</span><b>${b.id}</b></div><div class="summary-line"><span>Artist</span><b>${detail.artistName}</b></div><div class="summary-line"><span>Booking status</span><b>${b.status}</b></div><div class="summary-line"><span>${b.status==='Pending'?'Provisional artist quote':'Final artist fee'}</span><b>${fmtPaise(b.artistFeePaise)}</b></div><div class="summary-line"><span>Platform fee</span><b>${fmtPaise(b.platformFeePaise)}</b></div><div class="summary-line total"><span>Total / INR</span><b>${fmtPaise(b.finalAmountPaise)}</b></div>${order?`<div class="payment-reference"><p>Razorpay order: <code>${order.providerOrderId||'Creation not yet confirmed'}</code></p><p>Last provider check: ${order.reconciledAt?new Date(order.reconciledAt).toLocaleString():'Not checked yet'}</p>${order.sessionExpiresAt?`<p>Checkout session expiry: ${new Date(order.sessionExpiresAt).toLocaleString()}. This is not proof that a pending payment failed.</p>`:''}</div>`:''}
 ${detail.warning?`<div class="payment-alert" role="status">${detail.warning}</div>`:''}${order?.reviewReason?`<div class="payment-alert" role="alert">${order.reviewReason} Contact the administrator with your booking and transaction references. Do not pay again.</div>`:''}
 ${!detail.configured?'<div class="payment-alert">Checkout is disabled until the administrator configures Razorpay credentials. Saved transaction history remains visible.</div>':''}
 ${detail.canPay?`<div class="upi-guidance"><h3>UPI, cards &amp; more</h3><p>On desktop, choose UPI in Razorpay Checkout to scan the provider-generated QR when available. On mobile, choose one of the UPI apps offered by Razorpay.</p><p>${detail.mode==='test'?'Test Mode simulates payments. Real UPI Intent and QR scanning require Live Mode and account eligibility; do not scan a test QR with a real payment app.':'Available payment methods and QR expiry are controlled by Razorpay for this account and device.'}</p></div><button class="btn btn-coral btn-block" data-action="start-checkout" data-id="${b.id}" ${!detail.configured||checkoutInProgress||detail.warning?'disabled':''}>${checkoutInProgress?'Checkout in progress...':'Pay '+fmtPaise(b.finalAmountPaise)+' securely'}</button>`:''}
 ${b.paymentStatus==='authorized'?'<p class="request-note">Payment is authorized, not captured. Please wait and refresh; do not initiate another payment.</p>':''}
 <button class="btn btn-outline-paper btn-block" style="margin-top:12px" data-action="refresh-payment" ${checkoutInProgress?'disabled':''}>Refresh verified status</button><p class="payment-disclaimer">Funds received by the platform are not an artist payout. A closed or expired Checkout may still produce a late payment; the server checks the existing order before retrying.</p></div>
 <div class="panel"><h3>Transactions &amp; receipts</h3>${transactions.length?transactions.map(t=>`<div class="payment-transaction"><div><b>${fmtPaise(t.amountPaise)}</b> ${paymentBadge(t.status)}<p><code>${t.providerPaymentId}</code></p><p>${t.method||'Method pending'}${t.failureMessage?' / '+t.failureMessage:''}${t.refundedPaise?' / Refunded '+fmtPaise(t.refundedPaise):''}</p></div>${t.capturedAt?`<button class="btn btn-sm btn-outline-paper" data-action="nav" data-view="receipt" data-id="${t.providerPaymentId}">View receipt</button>`:''}</div>`).join(''):'<p class="payment-disclaimer">No provider transaction has been verified yet.</p>'}</div></div>`;
}
function renderPaymentHistory(){return `<div class="page-hero"><div class="wrap"><span class="eyebrow">Your payments</span><h1>Payment history</h1><p>Saved Razorpay references and verified transaction details. Test transactions are labeled.</p></div></div><div class="wrap" style="padding:36px 0 80px"><div class="panel">${PAYMENT_HISTORY.length?`<table class="tbl"><thead><tr><th>Booking</th><th>Amount / mode</th><th>Payment</th><th>Provider reference</th><th></th></tr></thead><tbody>${PAYMENT_HISTORY.map(p=>`<tr><td>${p.eventName}<br><small>${p.bookingId}</small></td><td>${fmtPaise(p.amountPaise)}<br>${p.mode==='test'?'Test Mode':'Live Mode'}</td><td>${paymentBadge(p.paymentStatus)}</td><td><code>${p.providerOrderId||p.receipt}</code></td><td><button class="btn btn-sm btn-outline-paper" data-action="nav" data-view="payment" data-id="${p.bookingId}">Details &amp; receipts</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty-state"><h3>No payment orders yet</h3><p>Accepted bookings will offer a Pay Now action. Your payment history will appear here once Checkout is prepared.</p><button class="btn btn-coral" data-action="nav" data-view="organizer-bookings">View bookings</button></div>'}</div></div>`;}
function renderReceipt(){
 const r=PAYMENT_RECEIPT;if(!r)return '<div class="empty-state"><h2>Receipt unavailable</h2></div>';

 return `<div class="booking-shell receipt-panel"><span class="eyebrow">${r.mode==='test'?'Test payment receipt / No real money':'Payment receipt'}</span><h1>Capture receipt</h1><p class="payment-disclaimer">A saved record of provider capture. This is not a tax invoice or a confirmation of payout to the artist.</p><div class="panel" style="margin-top:24px"><div class="summary-line"><span>Reference</span><b>${r.receiptReference}</b></div><div class="summary-line"><span>Booking</span><b>${r.bookingId}</b></div><div class="summary-line"><span>Event / artist</span><b>${r.eventName}<br>${r.artistName}</b></div><div class="summary-line"><span>Provider order</span><code>${r.providerOrderId}</code></div><div class="summary-line"><span>Provider payment</span><code>${t.providerPaymentId}</code></div><div class="summary-line"><span>Booking status</span><b>${r.bookingStatus}</b></div><div class="summary-line"><span>Booking payment status</span>${paymentBadge(r.paymentStatus)}</div><div class="summary-line"><span>Transaction status</span>${paymentBadge(t.status)}</div><div class="summary-line"><span>Capture verified at</span><b>${new Date(t.capturedAt).toLocaleString()}</b></div><div class="summary-line total"><span>Captured / INR</span><b>${fmtPaise(t.amountPaise)}</b></div><div class="summary-line"><span>Refunded</span><b>${fmtPaise(t.refundedPaise)}</b></div><p class="payment-disclaimer">${r.payoutStatus}</p><button class="btn btn-coral" data-action="print-receipt">Print / save receipt</button><button class="btn btn-outline-paper" data-action="nav" data-view="payment" data-id="${r.bookingId}">Back to payment</button></div></div>`;
}
function renderAdminPayments(){
 return `<div class="page-hero"><div class="wrap"><span class="eyebrow">Admin / Payment operations</span><h1>Payments &amp; exceptions</h1><p>Provider captures are platform receipts, not artist payouts. Review cancellations, refunds and unresolved orders in the Razorpay Dashboard.</p></div></div><div class="wrap" style="padding:36px 0 80px"><div class="panel"><div class="payment-admin-filters"><div class="f-group"><label for="pay-filter-status">Order or transaction status</label><select id="pay-filter-status">${['','creating','created','pending','authorized','failed','captured','review_required','creation_unknown','partially_refunded','refunded'].map(v=>`<option value="${v}" ${paymentAdminFilters.status===v?'selected':''}>${v||'All statuses'}</option>`).join('')}</select></div><div class="f-group"><label for="pay-filter-mode">Mode</label><select id="pay-filter-mode">${['','test','live'].map(v=>`<option value="${v}" ${paymentAdminFilters.mode===v?'selected':''}>${v||'All modes'}</option>`).join('')}</select></div><div class="f-group"><label for="pay-filter-q">Booking, order or transaction reference</label><input id="pay-filter-q" value="${escapeRecord(paymentAdminFilters.q)}"></div><button class="btn btn-coral" data-action="filter-payments">Apply filters</button><button class="btn btn-outline-paper" data-action="reset-payment-filters">Reset</button></div><p>${ADMIN_PAYMENTS.total} payment order${ADMIN_PAYMENTS.total===1?'':'s'}</p><table class="tbl"><thead><tr><th>Booking / mode</th><th>Amount / status</th><th>Provider references</th><th>Exception / review log</th><th>Actions</th></tr></thead><tbody>${ADMIN_PAYMENTS.orders.map(p=>`<tr><td>${p.eventName}<br><small>${p.bookingId}<br>${p.mode.toUpperCase()} / ${p.bookingStatus}</small></td><td>${fmtPaise(p.amountPaise)}<br>${paymentBadge(p.status)}</td><td><code>${p.providerOrderId||'Order unresolved'}</code><br><small>Receipt ${p.receipt}</small>${p.transactions.map(t=>`<p><code>${t.providerPaymentId}</code><br>${paymentBadge(t.status)} ${fmtPaise(t.amountPaise)}${t.refundedPaise?'<br>Refunded '+fmtPaise(t.refundedPaise):''}</p>`).join('')}</td><td>${p.reviewReason||'No exception recorded'}${p.reviewLog.map(log=>`<p><small>${log.createdAt}: ${log.note}</small></p>`).join('')}</td><td><button class="btn btn-sm btn-outline-paper" data-action="admin-reconcile-payment" data-id="${p.bookingId}">Reconcile</button><div class="f-group"><label for="review-${p.id}">Review note</label><textarea id="review-${p.id}" maxlength="2000"></textarea></div><button class="btn btn-sm btn-outline-paper" data-action="payment-review-note" data-id="${p.bookingId}" data-record="${p.id}">Save note</button></td></tr>`).join('')}</tbody></table><div class="pagination"><button class="btn btn-sm" data-action="payment-admin-page" data-page="${ADMIN_PAYMENTS.page-1}" ${ADMIN_PAYMENTS.page<=1?'disabled':''}>Previous</button><span>Page ${ADMIN_PAYMENTS.page}</span><button class="btn btn-sm" data-action="payment-admin-page" data-page="${ADMIN_PAYMENTS.page+1}" ${ADMIN_PAYMENTS.page*25>=ADMIN_PAYMENTS.total?'disabled':''}>Next</button></div></div></div>`;

 return `<div class="page-hero"><div class="wrap"><span class="eyebrow">Manage requests</span><h1>Your bookings</h1><p>Review requests, agree on a final quote, and track booking and payment status in one place.</p></div></div><div class="wrap" style="padding:40px 0 100px"><div class="panel">${BOOKINGS.length?`<table class="tbl"><thead><tr><th>Event / artist</th><th>Date</th><th>Quote / total</th><th>Booking / payment</th><th>Actions</th></tr></thead><tbody>${BOOKINGS.map(b=>`<tr><td><b>${b.eventName}</b><br>${findArtist(b.artistId)?.name||'Artist unavailable'}<br>${b.location}${b.notes?`<p>${b.notes}</p>`:''}<br><small>${b.id}</small></td><td>${fmtDate(b.date)}</td><td>${fmtPaise(b.finalAmountPaise)}${state.role==='artist'&&b.status==='Pending'?`<div class="f-group"><label for="final-price-${b.id}">Final artist fee (INR)</label><input id="final-price-${b.id}" type="number" step="0.01" min="1" value="${b.artistFeePaise/100}"></div>`:''}</td><td><span class="status-badge status-${b.status}">${b.status}</span><br>${paymentBadge(b.paymentStatus)}${!b.paymentRequired?'<br><small>Previous booking ? payment record unavailable</small>':''}</td><td>${state.role==='artist'&&b.status==='Pending'?button(b,'Accepted','Accept final quote')+button(b,'Declined','Decline'):''}${state.role==='organizer'&&b.status==='Accepted'&&b.paymentRequired&& !['paid','review_required','authorized'].includes(b.paymentStatus)?`<button class="btn btn-coral btn-sm" data-action="nav" data-view="payment" data-id="${b.id}">Pay Now</button>`:''}${state.role==='organizer'&&b.paymentRequired?`<button class="btn btn-sm btn-outline-paper" data-action="nav" data-view="payment" data-id="${b.id}">Payment details</button>`:''}${state.role==='organizer'&&['Pending','Accepted','Confirmed'].includes(b.status)?button(b,'Cancelled',b.paymentStatus==='paid'?'Cancel / refund review':'Cancel'):''}${state.role==='organizer'&&b.status==='Confirmed'&&b.date<=new Date().toISOString().slice(0,10)?button(b,'Completed','Mark completed'):''}</td></tr>`).join('')}</tbody></table>`:`<div class="empty-state"><h3>No bookings yet</h3><p>${state.role==='artist'?'Requests from organizers will appear here. Complete your profile to help them discover you.':'Explore artists and send your first booking request.'}</p><button class="btn btn-coral" data-action="nav" data-view="${state.role==='artist'?'artist-portfolio':'explore'}">${state.role==='artist'?'Edit profile':'Explore talent'}</button></div>`}</div></div>`;
