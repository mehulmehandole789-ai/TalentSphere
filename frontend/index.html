function currentPage(){
  switch(state.view){
    case "landing": return renderLanding();
    case "about": return renderAbout();
    case "login": return renderLogin();
    case "reset": return renderReset();
    case "verify-email": return renderEmailVerification();
    case "account-status": return renderAccountStatus();
    case "forgot": return renderForgot();
    case "register": return renderRegister();
    case "explore": return renderExplore();
    case "artist-profile": return renderArtistProfile();
    case "events": return renderEvents();
    case "event-detail": return renderEventDetail();
    case "create-event": return requireRole("organizer", renderCreateEvent);
    case "apply-form": return requireRole("artist", renderApplyForm);
    case "book": return requireRole("organizer", renderBookingForm);
    case "booking-review": return renderBookingReview();
    case "payment": return requireRole("organizer",renderPayment);
    case "payment-history": return requireRole("organizer",renderPaymentHistory);
    case "receipt": return requireRole("organizer",renderReceipt);
    case "admin-payments": return requireRole("admin",renderAdminPayments);
    case "confirmation": return renderConfirmation();
    case "artist-dashboard": return requireRole("artist", renderArtistDashboard);
    case "artist-portfolio": case "artist-profile-self": return requireRole("artist", renderArtistPortfolio);
    case "artist-applications": return requireRole("artist", renderArtistApplications);
    case "artist-bookings": return requireRole("artist", renderArtistBookings);
    case "collab-compose": return requireRole("artist",renderCollaborationForm);
    case "collaborate": return requireRole("artist", renderCollaborate);
    case "notifications": return requireAnyRole(renderNotifications);
    case "organizer-dashboard": return requireRole("organizer", renderOrganizerDashboard);
    case "organizer-applications": return requireRole("organizer", renderOrganizerApplications);
    case "organizer-bookings": return requireRole("organizer", renderOrganizerBookings);
    case "admin-dashboard": return requireRole("admin", renderAdminDashboard);
    case "admin-users": return requireRole("admin", renderAdminUsers);
    case "admin-events": return requireRole("admin", renderAdminEvents);
    case "admin-bookings": return requireRole("admin", renderAdminBookings);
    case "artist-profile-view": return requireRole("organizer", renderOrganizerDashboard);
    default: return `<div class="wrap empty-state"><span class="eyebrow">404 / Page not found</span><h2 style="margin-top:18px">Let us find your next connection.</h2><p>This page does not exist. Head back to explore the artist community.</p><button class="btn btn-coral" data-action="nav" data-view="landing">Back to home</button></div>`;
  }
}
function requireRole(role, fn){
  if(state.role!==role){ return renderLoginGate(role); }
  return fn();
}
function requireAnyRole(fn){
  if(!state.role) return renderLoginGate("artist");
  return fn();
}
function renderLoginGate(suggested){
 const signedIn=!!state.role;
 return `<div class="auth-shell"><div class="auth-card" style="text-align:center"><div style="margin-bottom:20px;color:var(--violet)">${icon('lock',30)}</div><h2>${signedIn?'A different creative workspace':'Your next connection awaits.'}</h2><p class="sub">${signedIn?`This action is available to ${suggested==='organizer'?'event organizers':'artists'}. You are signed in as ${state.role==='organizer'?'an organizer':'an '+state.role}.`:'Log in to manage requests, share your work and connect with the community.'}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${signedIn?`<button class="btn btn-coral" data-action="nav" data-view="${state.role}-dashboard">Back to my dashboard</button>`:`<button class="btn btn-outline-paper" data-action="nav" data-view="login">Log in</button><button class="btn btn-coral" data-action="nav" data-view="register" data-role="${suggested}">Create an account</button>`}</div></div></div>`;
}

function render(){
  if(state.loading){
    document.getElementById("app").innerHTML = renderNav()+`<main id="main-content" class="wrap skeleton-shell" aria-busy="true" aria-label="Loading page"><div class="loading-title" role="status"><span class="loading-dot"></span>Finding your next creative connection...</div><div class="card-row">${[0,1,2].map(()=>'<div><div class="skeleton-block"></div><div class="skeleton-line"></div></div>').join('')}</div></main>`;
    return;
  }
  document.getElementById("app").innerHTML = renderNav() + `<main id="main-content" tabindex="-1" class="page fade-in">${state.pageError?`<div class="empty-state"><h2>Unable to load this page</h2><p>${escapeRecord(state.pageError)}</p><button class="btn btn-coral" data-action="retry-page">Try again</button></div>`:currentPage()}</main>`;
  const titles={landing:'Discover artists. Create together.',explore:'Explore artists','artist-profile':findArtist(state.params.id)?.name||'Artist profile',events:'Creative opportunities',book:'Send a booking request',payment:'Booking payment','payment-history':'Payment history',receipt:'Payment receipt','admin-payments':'Payment operations',login:'Log in',register:'Join the community','verify-email':'Verify your email','account-status':'Account status',forgot:'Password recovery',reset:'Choose a new password'};
  const pageTitle=titles[state.view]||state.view.split('-').map(word=>word[0].toUpperCase()+word.slice(1)).join(' ');
  document.title=unescapeText(pageTitle)+' | TalentSphere';
  document.querySelectorAll('table.tbl').forEach(table=>{const body=table.tBodies[0];if(body&&!body.children.length){const cell=body.insertRow().insertCell();cell.colSpan=table.querySelectorAll('thead th').length;cell.className='table-empty';cell.textContent='No records yet. New activity will appear here.';}});
  syncAuthControls();
  bindInputs();
 document.querySelectorAll("label").forEach((label,i)=>{const input=label.parentElement.querySelector("input,textarea,select");if(input){if(!input.id)input.id="field-"+i;label.htmlFor=input.id;}});
 document.querySelectorAll("span[data-action],div[data-action]").forEach(el=>{el.tabIndex=0;el.setAttribute("role","button");el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();el.click();}};});
}

function bindInputs(){
  const availability=document.querySelector('[data-bind="explore-availability"]');if(availability)availability.addEventListener("change",e=>{state.explore.availability=e.target.value;state.explore.page=1;render();});
  document.querySelectorAll("[data-bind^=explore-]").forEach(el=>el.addEventListener("change",()=>state.explore.page=1));
  const q = document.querySelector('[data-bind="explore-q"]');
  if(q) q.addEventListener("input", e=>{state.explore.q=e.target.value;renderOnly();});
  const cat = document.querySelector('[data-bind="explore-category"]');
  if(cat) cat.addEventListener("change", e=>{state.explore.category=e.target.value;render();});
  const loc = document.querySelector('[data-bind="explore-location"]');
  if(loc) loc.addEventListener("change", e=>{state.explore.location=e.target.value;render();});
  const sort = document.querySelector('[data-bind="explore-sort"]');
  if(sort) sort.addEventListener("change", e=>{state.explore.sort=e.target.value;render();});
  const price = document.querySelector('[data-bind="explore-price"]');
  if(price) price.addEventListener("change", e=>{state.explore.maxPrice=+e.target.value;render();});
  if(price)price.addEventListener("input",e=>{e.target.parentElement.querySelector("label").textContent="Max price: "+fmtMoney(+e.target.value);});
}
// lighter re-render for text typing (keep focus)
function renderOnly(){
  const resultsArea = document.querySelector(".results-topbar")?.parentElement;
  if(!resultsArea){render();return;}
  // simplest reliable approach: full render but restore focus to search box
  const active = document.activeElement;
  const cursorPos = active && active.selectionStart;
  render();
  const q2 = document.querySelector('[data-bind="explore-q"]');
  if(q2){q2.focus(); if(cursorPos!=null) q2.setSelectionRange(cursorPos,cursorPos);}
}

/* ---------------- ACTIONS ---------------- */
document.addEventListener("click", async (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  if(el.tagName==="A")e.preventDefault();
  if(el.disabled || el.dataset.busy)return;
  const action = el.dataset.action;
  el.dataset.busy="true";el.setAttribute("aria-busy","true");
  const id = el.dataset.id;
  const authAction=['do-login','do-register','verify-code','resend-code','do-forgot','reset-password'].includes(action);
  if(authAction&&state.authBusy){delete el.dataset.busy;return;}
  if(authAction){state.authBusy=true;state.authNotice='';syncAuthControls();}

  try{
    if(['save-profile','upload-portfolio','remove-media'].includes(action)){const editor=document.querySelector('[data-profile-editor]'),own=findArtist(state.user?.artistId);if(!editor||state.role!=='artist'||!own||own.userId!==state.user?.id||editor.dataset.profileEditor!==own.id)throw new Error('You can only edit your own portfolio. Reload the page to check your account.');}
    const required={"do-register":["reg-name","reg-email","reg-pass"],"do-login":["login-email","login-pass"],"publish-event":["ev-name","ev-date","ev-time","ev-loc","ev-venue","ev-budget","ev-deadline"],"send-booking-request":["bk-event","bk-date","bk-loc"],"save-profile":["prof-bio","prof-loc","prof-price"],"send-collaboration":["collab-message"]};
    for(const key of required[action]||[]){const input=document.getElementById(key);input.required=true;if(!input.reportValidity())return;}

    switch(action){
      case "admin-approval": await api(`/admin/users/${id}/approval`,{method:"PATCH",body:JSON.stringify({approvalStatus:el.dataset.approval})});toast("Account approval updated. Email verification was not changed.");await nav("admin-users");break;
      case "start-checkout": await startCheckout(id);break;
      case "refresh-payment": await refreshPaymentStatus();break;
      case "print-receipt": window.print();break;
      case "filter-payments": paymentAdminFilters={status:document.getElementById('pay-filter-status').value,mode:document.getElementById('pay-filter-mode').value,q:document.getElementById('pay-filter-q').value,page:1};await nav('admin-payments');break;
      case "reset-payment-filters": paymentAdminFilters={status:'',mode:'',q:'',page:1};await nav('admin-payments');break;
      case "payment-admin-page": paymentAdminFilters.page=Number(el.dataset.page);await nav('admin-payments');break;
      case "admin-reconcile-payment": await api(`/payments/admin/bookings/${id}/reconcile`,{method:'POST',body:'{}'});toast('Provider reconciliation completed.');await nav('admin-payments');break;
      case "payment-review-note": await api(`/payments/admin/bookings/${id}/review-note`,{method:'POST',body:JSON.stringify({note:document.getElementById('review-'+el.dataset.record).value})});toast('Review note saved. Provider facts were not changed.');await nav('admin-payments');break;

      case "toggle-filters": state.filtersOpen=!state.filtersOpen;render();break;
      case "clear-filter": {const key=el.dataset.filter;state.explore[key]=key==='q'?'':key==='maxPrice'?null:'All';state.explore.page=1;render();break;}
      case "preview-media": {const artist=findArtist(id),index=Number(el.dataset.index);const img=document.getElementById('media-dialog-image');img.src=artist.media[index];img.alt=unescapeText(artist.name)+" portfolio work "+(index+1);document.getElementById('media-dialog').showModal();break;}
      case "close-preview": document.getElementById('media-dialog').close();break;

      case "do-forgot": {const email=document.getElementById('forgot-email');if(!email.reportValidity())return;state.authEmail=email.value.trim().toLowerCase();const result=await api('/auth/forgot-password',{method:'POST',body:JSON.stringify({email:state.authEmail})});state.authNotice=unescapeText(result.message);state.authNoticeError=false;render();break;}
      case "reset-password": {const password=document.getElementById('reset-password'),confirm=document.getElementById('reset-confirm');if(!password.reportValidity()||!confirm.reportValidity())return;if(password.value!==confirm.value){state.authNotice='Passwords do not match. Please enter them again.';state.authNoticeError=true;render();break;}const result=await api('/auth/reset-password',{method:'POST',body:JSON.stringify({token:state.params.id,password:password.value})});setAuthToken(null);state.role=null;state.user=null;state.authNotice=unescapeText(result.message);state.authNoticeError=false;history.replaceState(null,'','#login');await nav('login');break;}

      case "read-notification": await api(`/notifications/${id}/read`,{method:"PATCH"});await nav("notifications");break;
      case "retry-page": await nav(state.view,state.params);break;
      case "explore-page": state.explore.page=Number(el.dataset.page);render();break;
      case "nav": {
        const view = el.dataset.view;
        const params = {};
        if(id) params.id = id;
        state.authNotice="";state.authNoticeError=false;
        if(el.dataset.role) state.regRole = el.dataset.role;
        if(el.dataset.category){ state.explore.category = el.dataset.category; state.explore.page=1; }
        await nav(view, params);
        break;
      }
      case "togglenav": state.navOpen=!state.navOpen; render(); break;
      case "logout": {
        try{await api('/auth/logout',{method:'POST',body:'{}'});}catch(err){if(err.status!==401&&err.status!==403)toast('Signed out on this device. Server session revocation could not be confirmed.',true);}
        finally{setAuthToken(null);state.role=null;state.user=null;PAYMENT_DETAIL=null;PAYMENT_HISTORY=[];PAYMENT_RECEIPT=null;await nav('landing');}break;
      }

      case "setregrole": state.regRole = el.dataset.role; render(); break;

      case "do-login": {
        const email = ((document.getElementById("login-email")||{}).value || "").trim().toLowerCase();
        state.authEmail=email;
        const password = (document.getElementById("login-pass")||{}).value || "";
        if(!email || !password){ toast("Enter your email and password.", true); break; }
        const { token, user } = await api("/auth/login", { method:"POST", body:JSON.stringify({email,password}) });
        setAuthToken(token);
        state.role = user.role; state.user = { id:user.id, name:user.name, artistId:null };
        if(user.role==="artist"){
          const me = await api("/auth/me");
          state.user.artistId = me.artistProfile ? me.artistProfile.id : null;
        }
        toast(`Welcome back, ${user.name.split(' ')[0]}!`);
        await nav(user.role==="admin"?"admin-dashboard":user.role==="artist"?"artist-dashboard":"organizer-dashboard");
        break;
      }
      case "do-register": {
        const name=document.getElementById('reg-name').value.trim(),email=document.getElementById('reg-email').value.trim().toLowerCase(),password=document.getElementById('reg-pass').value;
        state.authEmail=email;
        const result=await api('/auth/register',{method:'POST',body:JSON.stringify({name,email,password,role:state.regRole,category:document.getElementById('reg-cat').value,location:document.getElementById('reg-loc').value.trim()})});
        setAuthToken(null);state.role=null;state.user=null;rememberVerification(email,result);state.authNotice=unescapeText(result.message);state.authNoticeError=false;await nav('verify-email');break;
      }
      case "verify-code": {
        const emailField=document.getElementById('verify-email'),codeField=document.getElementById('verification-code');if(!emailField.reportValidity()||!codeField.reportValidity())return;
        const email=emailField.value.trim().toLowerCase();state.authEmail=email;rememberVerification(email);
        const result=await api('/auth/verify-email',{method:'POST',body:JSON.stringify({email,code:codeField.value})});
        sessionStorage.removeItem('ts_email_verification');state.verification={email:'',resendAvailableAt:0};state.authNotice=unescapeText(result.message);state.authNoticeError=false;await nav('login');break;
      }
      case "resend-code": {
        const field=document.getElementById('verify-email');if(!field.reportValidity())return;
        const email=field.value.trim().toLowerCase();state.authEmail=email;
        const result=await api('/auth/resend-verification',{method:'POST',body:JSON.stringify({email})});rememberVerification(email,result);state.authNotice=unescapeText(result.message);state.authNoticeError=false;render();break;
      }

      case "reset-filters": state.explore = {page:1,availability:'All',q:"",category:"All",location:"All",sort:"Recommended",maxPrice:null}; render(); break;

      case "book": {
        if(!state.role){ await nav("login"); toast("Log in to book an artist.", true); break; }
        await nav("book", {id});
        break;
      }
      case "send-booking-request": {
        const artistId = el.dataset.id;
        const eventName = document.getElementById("bk-event").value.trim();
        const date = document.getElementById("bk-date").value;
        const duration = document.getElementById("bk-duration").value;
        const location = document.getElementById("bk-loc").value;
        const notes=document.getElementById("bk-notes").value;
        const bk = await api("/bookings", { method:"POST", body:JSON.stringify({artistId,eventName,date,duration,location,notes}) });
        state.bookingDraft = bk;
        toast("Booking request sent!");
        await nav("booking-review");
        break;
      }
      case "booking-status": {
 let finalPricePaise;
        if(el.dataset.status==='Accepted'){
          const field=document.getElementById('final-price-'+id);if(!field.reportValidity())return;
          const value=field.value;if(!/^\d+(\.\d{1,2})?$/.test(value))throw new Error('Enter a final INR fee with up to two decimal places.');
          const [whole,fraction='']=value.split('.');finalPricePaise=Number(whole)*100+Number(fraction.padEnd(2,'0'));
        }
        await api(`/bookings/${id}/status`,{method:"PATCH",body:JSON.stringify({status:el.dataset.status,finalPricePaise})});toast("Booking updated.");await nav(state.role==="artist"?"artist-bookings":"organizer-bookings");break;
      }
      case "apply": {
        if(!state.role){ await nav("login"); toast("Log in as an artist to apply.", true); break; }
        if(state.role!=="artist"){ toast("Only creative professionals can apply to events.", true); break; }
        await nav("apply-form", {id});
        break;
      }
      case "apply-prompt": await nav("login"); toast("Log in as an artist to apply to this event.", true); break;
      case "submit-application": {
        const eventId = el.dataset.id;
        const message = document.getElementById("app-msg").value || "I'd love to be part of this event.";
        const fee = +document.getElementById("app-fee").value || undefined;
        await api("/applications", { method:"POST", body:JSON.stringify({eventId,message,fee}) });
        toast("Application submitted!");
        await nav("event-detail",{id:eventId});
        break;
      }
      case "withdraw-application": {
        await api(`/applications/${id}`, { method:"PATCH", body:JSON.stringify({status:"Withdrawn"}) });
        toast("Application withdrawn.");
        await nav(state.view, state.params);
        break;
      }
      case "app-respond": {
        await api(`/applications/${id}`, { method:"PATCH", body:JSON.stringify({status:el.dataset.status}) });
        toast(`Application ${el.dataset.status.toLowerCase()}.`);
        await nav(state.view, state.params);
        break;
      }


      case "publish-event": {
        const name = document.getElementById("ev-name").value;
        const description = document.getElementById("ev-desc").value;
        const category = document.getElementById("ev-cat").value;
        const date = document.getElementById("ev-date").value;
        const time = document.getElementById("ev-time").value;
        const location = document.getElementById("ev-loc").value;
        const venue = document.getElementById("ev-venue").value;
        const talent = document.getElementById("ev-req").value;
        const numArtists = +document.getElementById("ev-num").value || 1;
        const budget = "₹"+(document.getElementById("ev-budget").value || "TBD");
        const deadline = document.getElementById("ev-deadline").value || date;
        await api("/events", { method:"POST", body:JSON.stringify({name,description,category,date,time,location,venue,talent,numArtists,budget,deadline}) });
        toast("Event published!");
        await nav("events");
        break;
      }

      case "collab-request": await nav("collab-compose",{id});break;
      case "send-collaboration": {
        const message=document.getElementById("collab-message").value.trim();
        if(!message)throw new Error("Describe the project you would like to create together.");
        await api("/collaborations",{method:"POST",body:JSON.stringify({toId:id,message})});toast("Collaboration request sent.");await nav("collaborate");break;
      }
      case "collab-respond": {
        await api(`/collaborations/${id}`, { method:"PATCH", body:JSON.stringify({status:el.dataset.status}) });
        toast(`Collaboration request ${el.dataset.status.toLowerCase()}.`);
        await nav(state.view, state.params);
        break;
      }


      case "save-profile": {
        const category = (document.getElementById("prof-cat")||{}).value;
        const bio = (document.getElementById("prof-bio")||{}).value;
        const price = Number(document.getElementById("prof-price").value);
        const availability = (document.getElementById("prof-avail")||{}).value;
        const updated = await api("/artists/me", { method:"PATCH", body:JSON.stringify({profileId:state.user.artistId,category,bio,price,availability,location:document.getElementById("prof-loc").value,exp:Number(document.getElementById("prof-exp").value),skills:document.getElementById("prof-skills").value.split(",").map(s=>s.trim()).filter(Boolean)}) });
        const idx = ARTISTS.findIndex(a=>a.id===updated.id);
        if(idx>=0) ARTISTS[idx] = updated;
        toast("Profile updated.");
        render();
        break;
      }
      case "upload-portfolio": {
 const file=document.getElementById("portfolio-file").files[0];
 if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024)throw new Error("Choose a PNG, JPEG or WebP image up to 5 MB.");
 const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
 await api("/artists/me/portfolio",{method:"POST",body:JSON.stringify({data,profileId:state.user.artistId})});toast("Image saved.");await nav("artist-portfolio");break;
 }
 case "remove-media": await api(`/artists/me/portfolio/${el.dataset.index}?profileId=${encodeURIComponent(state.user.artistId)}`,{method:"DELETE"});await nav("artist-portfolio");break;

      case "admin-verify": {
        const updated = await api(`/admin/artists/${id}/verify`, { method:"PATCH" });
        const idx = ARTISTS.findIndex(a=>a.id===id);
        if(idx>=0) ARTISTS[idx] = updated;
        toast(`${updated.name} verified.`);
        await nav(state.view, state.params);
        break;
      }
      case "admin-suspend": await api(`/admin/users/${id}/suspension`,{method:"PATCH"});toast("Account access updated.");await nav("admin-users");break;
    }
  }catch(err){
    if(authAction){state.authNotice=err.message;state.authNoticeError=true;
      if(err.data?.verificationRequired&&action!=='do-login'){rememberVerification(err.data.email||state.authEmail,err.data);await nav('verify-email');}
      else if(action==='do-login'&&await showAccountBlock(err)){}
      else{if(state.view==='verify-email')rememberVerification(document.getElementById('verify-email')?.value||state.verification.email,err.data||{});render();}
    }else toast(err.message,true);
  }finally{if(authAction){state.authBusy=false;syncAuthControls();}delete el.dataset.busy;el.removeAttribute("aria-busy");}
});

document.querySelector(".skip-link").addEventListener("click",e=>{e.preventDefault();document.getElementById("main-content")?.focus();});
document.getElementById("media-dialog").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close();});
window.addEventListener("storage",event=>{if(event.key==='ts_token')location.reload();});
window.addEventListener("hashchange",()=>{const [view,id]=location.hash.slice(1).split("/");if(view==="main-content"){document.getElementById("main-content")?.focus();return;}nav(view||"landing",id?{id:decodeURIComponent(id)}:{});});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input")&&!e.target.matches('[type="file"],[type="range"]')){const action=state.view==="login"?"do-login":state.view==="register"?"do-register":state.view==="verify-email"?"verify-code":state.view==="forgot"?"do-forgot":state.view==="reset"?"reset-password":null;if(action){e.preventDefault();document.querySelector(`[data-action="${action}"]`)?.click();}}});
render();
boot();
</script>
